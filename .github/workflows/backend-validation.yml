name: Backend Validation

on:
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v6
    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Build back-end
      run: bash ./gradlew --no-daemon :backend:assemble

  tests:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v6
    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Run unit and integration tests
      run: bash ./gradlew --no-daemon test

    - name: Upload back-end test reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: backend-test-reports
        path: |
          backend/build/reports/tests/test/
          backend/build/test-results/test/
        if-no-files-found: warn
        retention-days: 14