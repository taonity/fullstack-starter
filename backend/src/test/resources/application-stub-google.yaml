spring:
  security:
    oauth2:
      client:
        registration:
          google-fullstack-starter:
            provider: google
            client-id: stub-google-client-id
            client-secret: stub-google-client-secret
            redirect-uri: http://127.0.0.1:8080/login/oauth2/code/google-fullstack-starter
            authorization-grant-type: authorization_code
            scope: profile,email
          stub-alice:
            provider: google-stub-alice
            client-id: stub-google-client-id
            client-secret: stub-google-client-secret
            redirect-uri: http://127.0.0.1:8080/login/oauth2/code/stub-alice
            authorization-grant-type: authorization_code
            scope: profile,email
          stub-bob:
            provider: google-stub-bob
            client-id: stub-google-client-id
            client-secret: stub-google-client-secret
            redirect-uri: http://127.0.0.1:8080/login/oauth2/code/stub-bob
            authorization-grant-type: authorization_code
            scope: profile,email
          stub-editor:
            provider: google-stub-editor
            client-id: stub-google-client-id
            client-secret: stub-google-client-secret
            redirect-uri: http://127.0.0.1:8080/login/oauth2/code/stub-editor
            authorization-grant-type: authorization_code
            scope: profile,email
          stub-viewer:
            provider: google-stub-viewer
            client-id: stub-google-client-id
            client-secret: stub-google-client-secret
            redirect-uri: http://127.0.0.1:8080/login/oauth2/code/stub-viewer
            authorization-grant-type: authorization_code
            scope: profile,email
        provider:
          google:
            authorization-uri: http://127.0.0.1:${app.stub.google.port}/oauth2/authorize
            token-uri: http://127.0.0.1:${app.stub.google.port}/oauth2/token
            user-info-uri: http://127.0.0.1:${app.stub.google.port}/oauth2/v3/userinfo
          google-stub-alice:
            authorization-uri: http://127.0.0.1:${app.stub.google.port}/oauth2/authorize
            token-uri: http://127.0.0.1:${app.stub.google.port}/oauth2/token
            user-info-uri: http://127.0.0.1:${app.stub.google.port}/oauth2/v3/userinfo/alice
            user-name-attribute: sub
          google-stub-bob:
            authorization-uri: http://127.0.0.1:${app.stub.google.port}/oauth2/authorize
            token-uri: http://127.0.0.1:${app.stub.google.port}/oauth2/token
            user-info-uri: http://127.0.0.1:${app.stub.google.port}/oauth2/v3/userinfo/bob
            user-name-attribute: sub
          google-stub-editor:
            authorization-uri: http://127.0.0.1:${app.stub.google.port}/oauth2/authorize
            token-uri: http://127.0.0.1:${app.stub.google.port}/oauth2/token
            user-info-uri: http://127.0.0.1:${app.stub.google.port}/oauth2/v3/userinfo/editor
            user-name-attribute: sub
          google-stub-viewer:
            authorization-uri: http://127.0.0.1:${app.stub.google.port}/oauth2/authorize
            token-uri: http://127.0.0.1:${app.stub.google.port}/oauth2/token
            user-info-uri: http://127.0.0.1:${app.stub.google.port}/oauth2/v3/userinfo/viewer
            user-name-attribute: sub

app:
  stub:
    google:
      port: 19561
  default-success-url: http://127.0.0.1:3000
  login-url: http://127.0.0.1:3000
  console:
    # Bootstrap the primary stub user as the console OWNER for local testing.
    owner-emails: test@example.com
  # Dev-only: lets the frontend offer "log in as" shortcuts for the stub users above.
  dev:
    stub-logins:
      - registration-id: google-fullstack-starter
        label: Owner (test@example.com)
      - registration-id: stub-alice
        label: Alice (alice@example.com)
      - registration-id: stub-bob
        label: Bob (bob@example.com)
      - registration-id: stub-editor
        label: Editor (editor@example.com)
      - registration-id: stub-viewer
        label: Viewer (viewer@example.com)

logging:
  level:
    WireMock: warn
