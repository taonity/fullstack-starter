server:
  port: 8080
  forward-headers-strategy: native
  servlet:
    session:
      timeout: 7d

app:
  minimised-http-servlet-logging: true
  cookie:
    secure: true
    same-site: Lax
  console:
    owner-emails: ${CONSOLE_OWNER_EMAILS:artiom.diulgher@gmail.com}
    admin-emails: ${CONSOLE_ADMIN_EMAILS:}
    max-page-size: 100
  retention:
    audit:
      retention-days: 14
      cron: "0 30 3 * * *"

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
      cache:
        time-to-live: 60s
      group:
        external:
          include: google
    prometheus:
      enabled: true
  info:
    git:
      enabled: false
    build:
      enabled: false
  metrics:
    tags:
      application: fullstack-starter

spring:
  profiles:
    group:
      local: plain-log,active-properties-logging
      stage: postgres-container,prod-google
      prod: postgres-container,prod-google
  application:
    name: fullstack-starter
  session:
    jdbc:
      initialize-schema: never

logging:
  structured:
    format:
      console: logstash
    json:
      add:
        git_commit: "@git.commit.id.abbrev@"
        app_version: "@project.version@"
        service: ${spring.application.name}
      stacktrace:
        root: first
        max-length: 2048
        include-common-frames: false
        include-hashes: true
  level:
    WireMock: warn
