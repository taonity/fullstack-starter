services:
  backend:
    extends:
      file: ../${COMPOSE_CREDENTIALS_FILE:-credentials-env.yml}
      service: backend
    image: generaltao725/fullstack-starter-backend:latest
    mem_limit: ${BACKEND_MEMORY_LIMIT:-768m}
    environment:
      JDK_JAVA_OPTIONS: --add-opens java.base/java.lang=ALL-UNNAMED
      JAVA_TOOL_OPTIONS: >-
        -XX:InitialRAMPercentage=${BACKEND_INITIAL_RAM_PERCENTAGE:-10.0}
        -XX:MaxRAMPercentage=${BACKEND_MAX_RAM_PERCENTAGE:-60.0}
        ${BACKEND_JAVA_EXTRA_OPTIONS:-}
#      LOGGING_LEVEL_ROOT: TRACE
#      LOGGING_LEVEL_ORG_EXAMPLE_FULLSTACKSTARTER: DEBUG
    command: --spring.profiles.active=${SPRING_PROFILES_ACTIVE:?SPRING_PROFILES_ACTIVE must be set}
    volumes:
      - ./config:/fullstack-starter/config
    healthcheck:
      test: curl localhost:8080/actuator/health || exit 1
      interval: 10s
      timeout: 10s
      retries: 100