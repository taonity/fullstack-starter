services:
  secrets-migrate:
    image: flyway/flyway:10.18.0
    profiles: [secrets-bootstrap]
    logging:
      driver: none
    restart: "no"
    cpus: "0.50"
    mem_limit: 384m
    memswap_limit: 512m
    pids_limit: 256
    command: migrate
    environment:
      FLYWAY_PLACEHOLDER_PREFIX: "{{ "
      FLYWAY_PLACEHOLDER_SUFFIX: " }}"
    volumes:
      - type: bind
        source: ${SECRET_DIRECTORY:?SECRET_DIRECTORY must be set}/bootstrap/flyway.conf
        target: /flyway/conf/flyway.conf
        read_only: true
        bind:
          create_host_path: false
      - ./flyway/sql:/flyway/sql:ro
    networks:
      - backend

  secrets-provision:
    image: postgres:16
    profiles: [secrets-bootstrap]
    logging:
      driver: none
    restart: "no"
    cpus: "0.50"
    mem_limit: 128m
    memswap_limit: 192m
    pids_limit: 128
    environment:
      PGHOST: db
      PGDATABASE: fullstack_starter_db
      PGUSER: ${POSTGRES_USER:-postgres}
      PGPASSFILE: /run/secrets/pgpass
    entrypoint: [psql, -X, --no-password, --set, ON_ERROR_STOP=1, --file, /provision.sql]
    volumes:
      - ./db/provision-secrets.sql:/provision.sql:ro
      - type: bind
        source: ${SECRET_DIRECTORY:?SECRET_DIRECTORY must be set}/bootstrap
        target: /run/secrets
        read_only: true
        bind:
          create_host_path: false
    networks:
      - backend