services:
  db:
    extends:
      file: ../${COMPOSE_CREDENTIALS_FILE:-credentials-env.yml}
      service: db
    image: postgres:16
    environment:
      POSTGRES_DB: fullstack_starter_db
    volumes:
      - volume-db:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER:-postgres}\" -d fullstack_starter_db" ]
      interval: 5s
      timeout: 5s
      retries: 100

