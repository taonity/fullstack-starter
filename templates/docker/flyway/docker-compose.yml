services:
  flyway:
    extends:
      file: ../${COMPOSE_CREDENTIALS_FILE:-credentials-env.yml}
      service: flyway
    image: flyway/flyway:10.18.0
    command: migrate
    environment:
      FLYWAY_PLACEHOLDER_PREFIX: "{{ "
      FLYWAY_PLACEHOLDER_SUFFIX: " }}"
      POSTGRES_ADDRESS: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: fullstack_starter_db
    volumes:
      - ./sql:/flyway/sql