services:
  flyway:
    image: flyway/flyway:10.18.0
    command: migrate
    environment:
      FLYWAY_PLACEHOLDER_PREFIX: "{{ "
      FLYWAY_PLACEHOLDER_SUFFIX: " }}"
      POSTGRES_ADDRESS: ${POSTGRES_ADDRESS:-db}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-fullstack_starter_db}
      POSTGRES_APP_USER: ${POSTGRES_APP_USER:-app}
    env_file:
      - ../${COMPOSE_ENV_FILE:-.env}
    volumes:
      - ./flyway.conf:/flyway/conf/flyway.conf
      - ./sql:/flyway/sql