services:
  db:
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD_FILE: /run/secrets/password
    volumes:
      - type: bind
        source: ${SECRET_DIRECTORY:?SECRET_DIRECTORY must be set}/db
        target: /run/secrets
        read_only: true
        bind:
          create_host_path: false

  backend:
    environment:
      SPRING_CONFIG_IMPORT: configtree:/run/secrets/
    volumes:
      - type: bind
        source: ${SECRET_DIRECTORY:?SECRET_DIRECTORY must be set}/backend
        target: /run/secrets
        read_only: true
        bind:
          create_host_path: false

  flyway:
    volumes:
      - type: bind
        source: ${SECRET_DIRECTORY:?SECRET_DIRECTORY must be set}/flyway/flyway.conf
        target: /flyway/conf/flyway.conf
        read_only: true
        bind:
          create_host_path: false

  postgres-export:
    environment:
      PGUSER: ${POSTGRES_BACKUP_USER:-starter_backup}
      PGPASSFILE: /run/secrets/pgpass
      BACKUP_INCLUDE_ROLE_PASSWORDS: "false"
    volumes:
      - type: bind
        source: ${SECRET_DIRECTORY:?SECRET_DIRECTORY must be set}/backup
        target: /run/secrets
        read_only: true
        bind:
          create_host_path: false